<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Early contributions shorten time-to-goal more - especially at lower CAGR</title>
  <desc id="desc">Bar comparison of years saved by a $20k contribution in 2026 versus 2034, at 4% and 10% assumed CAGR. Early money saves more absolute years when the rate is lower.</desc>

  <rect width="640" height="900" fill="#0f1412"/>
  <rect x="16" y="16" width="608" height="868" rx="16" fill="#18201c" stroke="#5a7468" stroke-width="1.5"/>

  <text x="40" y="64" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Early contributions pull the</text>
  <text x="40" y="96" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">goal date forward more</text>
  <text x="40" y="132" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Same start ($100k), goal ($300k), $20k contribution.</text>
  <text x="40" y="154" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Only the year and assumed CAGR change.</text>

  <!-- 4% panel -->
  <rect x="40" y="180" width="560" height="250" rx="12" fill="#24302a" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="60" y="218" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Assumed CAGR 4%</text>
  <text x="60" y="246" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Years saved vs base path (no extras)</text>

  <text x="60" y="300" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Early</text>
  <rect x="130" y="276" width="220" height="40" rx="8" fill="#34d399"/>
  <text x="368" y="304" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">2026 = 4.65y</text>

  <text x="60" y="366" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Later</text>
  <rect x="130" y="342" width="138" height="40" rx="8" fill="#10b981"/>
  <text x="286" y="370" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">2034 = 2.93y</text>

  <text x="60" y="414" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Rel. effect. of early ~ 1.59x</text>

  <!-- 10% panel -->
  <rect x="40" y="450" width="560" height="250" rx="12" fill="#24302a" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="60" y="488" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Assumed CAGR 10%</text>
  <text x="60" y="516" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Same dollars - growth does more of the work</text>

  <text x="60" y="570" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Early</text>
  <rect x="130" y="546" width="90" height="40" rx="8" fill="#34d399"/>
  <text x="238" y="574" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">2026 = 1.91y</text>

  <text x="60" y="636" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Later</text>
  <rect x="130" y="612" width="38" height="40" rx="8" fill="#10b981"/>
  <text x="186" y="640" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">2034 = 0.79y</text>

  <text x="60" y="684" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Rel. effect. of early ~ 2.43x - fewer calendar years</text>

  <!-- Takeaway -->
  <rect x="40" y="722" width="560" height="138" rx="12" fill="#143028" stroke="#34d399" stroke-width="2"/>
  <text x="60" y="760" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Takeaway</text>
  <text x="60" y="792" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Early dollars count disproportionately.</text>
  <text x="60" y="820" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">At a lower assumed CAGR, absolute years saved</text>
  <text x="60" y="842" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">by contributing early are larger.</text>
</svg>
