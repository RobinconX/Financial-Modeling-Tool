# Build the static app and deploy to GitHub Pages.
# Setup: see README section "GitHub Pages".
name: Deploy GitHub Pages

on:
  push:
    branches: [v1-prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release log entry for prod deploy
        if: github.ref == 'refs/heads/v1-prod'
        run: RELEASE_LOG_PROD_BUILD=1 GITHUB_SHA=${{ github.sha }} npm test -- tests/lib/releaseLog.test.ts

      - name: Build
        run: npm run build
        env:
          # Set if the site is served from https://<user>.github.io/<repo>/
          # Leave empty for a custom domain or user/org root site.
          VITE_BASE: ${{ vars.VITE_BASE }}
          # Quote/FX proxy for static Pages (Cloudflare Worker URL, no trailing slash).
          # Example: https://fmt-market-api.<account>.workers.dev
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_GIT_SHA: ${{ github.sha }}
          # Public Web3Forms key (override via repo Actions variable if you rotate it).
          VITE_FEEDBACK_FORM_ACCESS_KEY: ${{ vars.VITE_FEEDBACK_FORM_ACCESS_KEY || 'ba68b876-5a19-40f8-a5b8-44cef974b98f' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
